{% extends 'base.html' %}{% block title %}Report Issue | CivicCare{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="form-card"><span class="eyebrow">HELP IMPROVE YOUR AREA</span><h1 class="section-title">Report a public issue</h1><form method="post" enctype="multipart/form-data"><label class="form-label">Category *</label><select class="form-select mb-3" name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select><label class="form-label">Short title *</label><input class="form-control mb-3" name="title" maxlength="100" required><label class="form-label">Description *</label><textarea class="form-control mb-3" name="description" rows="4" required></textarea><label class="form-label">Location / landmark *</label><input class="form-control mb-3" name="location" required placeholder="Street, landmark, area"><div class="row"><div class="col-md-6"><label class="form-label">Latitude (optional)</label><input class="form-control mb-3" name="latitude" type="number" step="any"></div><div class="col-md-6"><label class="form-label">Longitude (optional)</label><input class="form-control mb-3" name="longitude" type="number" step="any"></div></div><button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="getLocation()">Use my current location</button><span id="locationMsg" class="small muted ms-2"></span><label class="form-label">Photo (optional, max 5 MB)</label><input class="form-control mb-4" type="file" name="photo" accept=".png,.jpg,.jpeg,.webp"><button class="btn btn-primary">Submit report</button></form></div></div></div>{% endblock %}{% block scripts %}<script>function getLocation(){const m=document.getElementById('locationMsg');if(!navigator.geolocation){m.textContent='Location not supported';return;}m.textContent='Requesting permission...';navigator.geolocation.getCurrentPosition(p=>{document.querySelector('[name=latitude]').value=p.coords.latitude;document.querySelector('[name=longitude]').value=p.coords.longitude;m.textContent='Coordinates added';},()=>m.textContent='Could not access location.');}</script>{% endblock %}
