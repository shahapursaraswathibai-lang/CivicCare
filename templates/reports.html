{% extends 'base.html' %}{% block title %}Reports | CivicCare{% endblock %}{% block content %}<h1 class="section-title">Reports</h1><form class="card card-body mb-3"><div class="row g-2"><div class="col-md-5"><select class="form-select" name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c }}" {% if selected_category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-md-5"><select class="form-select" name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{ s }}" {% if selected_status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div></div></form><div class="card"><div class="card-body table-responsive"><table class="table"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Priority</th></tr></thead><tbody>{% for r in reports %}<tr><td>#{{ r.id }}</td><td><a href="{{ url_for('report_detail',report_id=r.id) }}">{{ r.title }}</a></td><td>{{ r.category }}</td><td>{{ r.status }}</td><td>{{ r.priority }}</td></tr>{% else %}<tr><td colspan="5">No reports match.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
