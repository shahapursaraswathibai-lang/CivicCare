{% extends 'base.html' %}{% block title %}Admin Edit #{{ report.id }}{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="form-card"><span class="eyebrow">ADMINISTRATOR CONTROL</span><h1 class="section-title">Edit complaint #{{ report.id }}</h1><p class="muted">Status, assignment and admin notes are retained.</p><form method="post" enctype="multipart/form-data"><label class="form-label">Category *</label><select class="form-select mb-3" name="category" required>{% for c in categories %}<option {% if report.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><label class="form-label">Title *</label><input class="form-control mb-3" name="title" value="{{ report.title }}" required><label class="form-label">Description *</label><textarea class="form-control mb-3" name="description" rows="4" required>{{ report.description }}</textarea><label class="form-label">Location *</label><input class="form-control mb-3" name="location" value="{{ report.location }}" required><div class="row"><div class="col"><label class="form-label">Latitude</label><input class="form-control mb-3" name="latitude" type="number" step="any" value="{{ report.latitude or '' }}"></div><div class="col"><label class="form-label">Longitude</label><input class="form-control mb-3" name="longitude" type="number" step="any" value="{{ report.longitude or '' }}"></div></div>{% if report.photo %}<label class="form-label">Current photo</label><br><img class="report-photo mb-3" src="{{ url_for('static',filename='uploads/'+report.photo) }}">{% endif %}<label class="form-label">Replace photo</label><input class="form-control mb-4" type="file" name="photo" accept=".png,.jpg,.jpeg,.webp"><button class="btn btn-primary">Save corrections</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin') }}">Cancel</a></form></div></div></div>{% endblock %}
